name: Build RAX3000M Firmware

on:
  push:
    branches: [openwrt-24.10-6.6]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 检出源码（你的 fork，openwrt-24.10-6.6 分支）
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6

      - name: 准备编译环境
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools rsync swig unzip \
            zlib1g-dev file wget subversion
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: 运行自定义脚本（加 feeds + 开 BPF）
        run: |
          chmod +x custom/custom-feeds.sh
          ./custom/custom-feeds.sh

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载 RAX3000M 配置
        run: |
          cp custom/rax3000m.config .config
          make defconfig
          grep -E 'NET_SCH_BPF|NET_CLS_BPF|luci-app-openclash|luci-app-quickfile|luci-app-store|luci-app-bandix' .config || echo "WARN: some config missing"

      - name: 下载依赖
        run: make download -j$(nproc) 2>&1 | tail -40

      - name: 编译
        run: |
          make -j$(nproc) 2>&1 | tail -60

      - name: 收集固件 4 件套
        id: collect
        run: |
          mkdir -p output
          BIN="bin/targets/mediatek/filogic"
          cp "$BIN"/*-cmcc_rax3000m-nand-preloader.bin   output/preloader.bin
          cp "$BIN"/*-cmcc_rax3000m-nand-bl31-uboot.fip output/uboot.bin
          cp "$BIN"/*-cmcc_rax3000m-recovery.itb output/recovery.itb
          cp "$BIN"/*-cmcc_rax3000m-sysupgrade.itb  output/sysupgrade.itb
          echo "--- output 固件清单 ---"
          ls -la output/

      - name: 上传固件到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: rax3000M-firmware
          path: output/
          if-no-files-found: error

      - name: 创建 Release（方便下载）
        if: github.ref == 'refs/heads/openwrt-24.10-6.6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rax3000M-${{ github.run_number }}
          name: "RAX3000M 固件 #${{ github.run_number }}"
          files: output/*
          draft: true
